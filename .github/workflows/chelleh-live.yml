# هر ساعت نسخه ثابت فهرست چله‌ها و دوره‌ها (chelleh/live.json) را از Supabase تازه می‌کند (tools/chelleh-live.mjs).
# سایت وقتی به Supabase نمی‌رسد (مثلاً اینترنت همراه اول بدون فیلترشکن)، منو و برگه ثبت‌نام چله را از همین فایل نشان می‌دهد.
name: Chelleh list snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chelleh-live
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tools/chelleh-live.mjs
      - name: Commit if changed
        run: |
          git diff --quiet -- chelleh/live.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chelleh/live.json
          git commit -m 'Update the chelleh list snapshot'
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
